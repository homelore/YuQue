[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yuque-mcp"
version = "0.1.0"
description = "MCP server for Yuque (语雀) notes — read and manage knowledge bases and docs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
yuque-mcp = "yuque_mcp.server:main"

[tool.setuptools.packages.find]
include = ["yuque_mcp*"]
